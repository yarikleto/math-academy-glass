<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Math Academy Glass</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="window">
      <header class="titlebar">
        <span class="titlebar-label">Math Academy Glass</span>
      </header>

      <section class="content">
        <div class="brand-row">
          <div class="brand-icon" aria-hidden="true">
            <img src="../icons/icon.svg" alt="">
          </div>
          <div class="brand-copy">
            <h1>Math Academy Glass</h1>
            <p>Unofficial study companion</p>
          </div>
          <label class="switch" id="enabled-switch">
            <span class="sr-only">Enable Math Academy Glass</span>
            <input id="enabled" type="checkbox" aria-describedby="extension-status" disabled>
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          </label>
        </div>

        <section class="control-card" id="appearance-controls" aria-labelledby="theme-heading">
          <div class="control-heading">
            <span id="theme-heading">Theme</span>
            <span id="mode-label" class="mode-label">System</span>
          </div>

          <div class="segmented-control" role="radiogroup" aria-label="Theme preference">
            <button class="segment" type="button" role="radio" data-theme="light" aria-checked="false" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.5"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
              </svg>
              <span>Light</span>
            </button>
            <button class="segment" type="button" role="radio" data-theme="system" aria-checked="true" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="13" rx="2"/>
                <path d="M8 21h8M12 17v4"/>
              </svg>
              <span>System</span>
            </button>
            <button class="segment" type="button" role="radio" data-theme="dark" aria-checked="false" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.3 15.7A8.5 8.5 0 0 1 8.3 3.7a8.5 8.5 0 1 0 12 12Z"/>
              </svg>
              <span>Dark</span>
            </button>
          </div>

          <p class="hint" id="theme-hint">Matches your Mac or Windows appearance.</p>
        </section>

        <div id="extension-status" class="status-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text" role="status" aria-live="polite" aria-atomic="true">Loading settings…</span>
          <a id="open-site" href="https://www.mathacademy.com/" target="_blank" rel="noreferrer">Open site</a>
        </div>

        <a
          class="creator-link"
          href="https://www.linkedin.com/in/yarik-leto/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Connect with creator Yarik Leto on LinkedIn"
        >
          <span class="linkedin-mark" aria-hidden="true">in</span>
          <span class="creator-copy">Like what I build? <strong>Let’s connect on LinkedIn</strong></span>
          <svg class="creator-arrow" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5 11 11 5M6 5h5v5"/>
          </svg>
        </a>
      </section>

      <footer>
        <span>Shortcut</span>
        <kbd>⌘ / Ctrl</kbd><span>+</span><kbd>⇧</kbd><span>+</span><kbd>L</kbd>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
